```svg
<svg
    xmlns="http://www.w3.org/2000/svg"
    viewBox="0 0 120 120"
    role="img"
    aria-labelledby="title desc"
>

    <title id="title">
        Programming Society Cyber Cell
    </title>

    <desc id="desc">
        Cyber security shield logo with programming code symbol
    </desc>


    <!-- =====================================================
         OUTER GLOW
    ====================================================== -->

    <defs>

        <filter
            id="glow"
            x="-50%"
            y="-50%"
            width="200%"
            height="200%"
        >

            <feGaussianBlur
                stdDeviation="3"
                result="blur"
            />

            <feMerge>

                <feMergeNode
                    in="blur"
                />

                <feMergeNode
                    in="SourceGraphic"
                />

            </feMerge>

        </filter>


        <linearGradient
            id="shieldGradient"
            x1="0"
            y1="0"
            x2="1"
            y2="1"
        >

            <stop
                offset="0%"
                stop-color="#80ddff"
            />

            <stop
                offset="50%"
                stop-color="#4cc9f0"
            />

            <stop
                offset="100%"
                stop-color="#8b7cff"
            />

        </linearGradient>


        <linearGradient
            id="innerGradient"
            x1="0"
            y1="0"
            x2="0"
            y2="1"
        >

            <stop
                offset="0%"
                stop-color="#10283c"
            />

            <stop
                offset="100%"
                stop-color="#06101c"
            />

        </linearGradient>

    </defs>


    <!-- =====================================================
         OUTER HEXAGON
    ====================================================== -->

    <path
        d="
            M60 5
            L107 32
            L107 78
            L60 110
            L13 78
            L13 32
            Z
        "
        fill="none"
        stroke="url(#shieldGradient)"
        stroke-width="2"
        opacity="0.35"
        filter="url(#glow)"
    />


    <!-- =====================================================
         SHIELD
    ====================================================== -->

    <path
        d="
            M60 15
            L96 33
            L92 70
            C89 88 76 99 60 105
            C44 99 31 88 28 70
            L24 33
            Z
        "
        fill="url(#innerGradient)"
        stroke="url(#shieldGradient)"
        stroke-width="3"
        filter="url(#glow)"
    />


    <!-- =====================================================
         SHIELD INNER LINE
    ====================================================== -->

    <path
        d="
            M60 22
            L88 37
            L85 68
            C82 82 72 91 60 97
            C48 91 38 82 35 68
            L32 37
            Z
        "
        fill="none"
        stroke="#4cc9f0"
        stroke-width="1"
        opacity="0.3"
    />


    <!-- =====================================================
         CODE SYMBOL
         < >
    ====================================================== -->

    <g
        fill="none"
        stroke="#4cc9f0"
        stroke-width="5"
        stroke-linecap="round"
        stroke-linejoin="round"
        filter="url(#glow)"
    >

        <!-- Left bracket -->

        <path
            d="M49 43 L39 58 L49 73"
        />

        <!-- Right bracket -->

        <path
            d="M71 43 L81 58 L71 73"
        />

    </g>


    <!-- =====================================================
         CENTER SLASH
    ====================================================== -->

    <path
        d="M64 40 L55 76"
        fill="none"
        stroke="#35e89b"
        stroke-width="4"
        stroke-linecap="round"
        filter="url(#glow)"
    />


    <!-- =====================================================
         SECURITY DOTS
    ====================================================== -->

    <circle
        cx="39"
        cy="84"
        r="2"
        fill="#35e89b"
    />

    <circle
        cx="47"
        cy="88"
        r="2"
        fill="#4cc9f0"
    />

    <circle
        cx="73"
        cy="88"
        r="2"
        fill="#4cc9f0"
    />

    <circle
        cx="81"
        cy="84"
        r="2"
        fill="#35e89b"
    />


    <!-- =====================================================
         TOP SECURITY NODE
    ====================================================== -->

    <circle
        cx="60"
        cy="15"
        r="3"
        fill="#80ddff"
        filter="url(#glow)"
    />


    <!-- =====================================================
         BOTTOM SECURITY NODE
    ====================================================== -->

    <circle
        cx="60"
        cy="105"
        r="2.5"
        fill="#35e89b"
        filter="url(#glow)"
    />

</svg>
```
